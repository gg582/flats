name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # Route Linux jobs to the self-hosted ARC scale set (flats-runners) when it is
  # alive, and fall back to GitHub-hosted runners when it is not. The ARC host
  # can sleep, so a heartbeat CronJob in the ARC cluster writes the current
  # unix time to the repository variable ARC_LAST_SEEN every minute. A
  # heartbeat younger than 3 minutes means the runners can pick up jobs.
  pick-runner:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      runner: ${{ steps.pick.outputs.runner }}
    steps:
      - id: pick
        env:
          LAST_SEEN: ${{ vars.ARC_LAST_SEEN }}
        run: |
          now=$(date +%s)
          case "$LAST_SEEN" in
          ''|*[!0-9]*) age= ;;
          *) age=$((now - LAST_SEEN)) ;;
          esac
          if [ -n "$age" ] && [ "$age" -lt 180 ]; then
            echo "runner=flats-runners" >>"$GITHUB_OUTPUT"
            echo "ARC heartbeat ${age}s ago -> flats-runners"
          else
            echo "runner=ubuntu-latest" >>"$GITHUB_OUTPUT"
            echo "ARC heartbeat missing or stale (${age:-unset}) -> ubuntu-latest"
          fi

  regression:
    needs: pick-runner
    runs-on: ${{ needs.pick-runner.outputs.runner }}
    timeout-minutes: 20
    env:
      # The QuickJS worker gzips the Mermaid asset too slowly for the default
      # 10s request timeout on the self-hosted runners; raise it only there.
      FLATS_DOCS_TEST_TIMEOUT: ${{ needs.pick-runner.outputs.runner == 'flats-runners' && '60s' || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      # The ARC runner image (ghcr.io/actions/actions-runner) ships without a C
      # toolchain, and the -race steps below need cgo on Linux.
      - name: Install a C toolchain for -race
        if: needs.pick-runner.outputs.runner != 'ubuntu-latest'
        run: |
          command -v gcc >/dev/null && exit 0
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends gcc libc6-dev
      - name: Verify module files
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - name: Tests
        run: go test ./...
      - name: Vet
        run: go vet ./...
      - name: Selected races
        run: go test -race ./internal/core ./internal/api ./internal/app ./internal/mcpx ./internal/store ./internal/expose/portal
      - name: FILES concurrency races
        run: go test -race ./internal/runtime -run 'TestConcurrentFiles|TestWASIRejectsJSHostABI'
      - name: CGO-free Linux builds
        run: |
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH="$arch" go build -o "$RUNNER_TEMP/flats-linux-$arch" ./cmd/flats
          done

  install-script:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Lint
        if: runner.os == 'Linux'
        run: shellcheck -s sh install.sh scripts/build-release.sh scripts/install-smoke.sh scripts/container-smoke.sh scripts/build-commit-image.sh scripts/build-commit-images.sh
      - name: Build release archives
        run: |
          # Linux builds every platform to check the release build; macOS only its own.
          if [ "$RUNNER_OS" = macOS ]; then
            FLATS_RELEASE_TARGETS="$(go env GOOS)/$(go env GOARCH)"
            export FLATS_RELEASE_TARGETS
          fi
          scripts/build-release.sh v0.0.0-ci "$RUNNER_TEMP/dist"
      - name: Start the systemd user manager
        if: runner.os == 'Linux'
        run: |
          sudo loginctl enable-linger "$USER"
          runtime=/run/user/$(id -u)
          for _ in $(seq 1 30); do [ -S "$runtime/bus" ] && break; sleep 1; done
          [ -S "$runtime/bus" ] || { echo "systemd user bus did not appear at $runtime/bus"; exit 1; }
          echo "XDG_RUNTIME_DIR=$runtime" >> "$GITHUB_ENV"
      - name: Install, upgrade, crash and uninstall the service
        run: scripts/install-smoke.sh "$RUNNER_TEMP/dist" v0.0.0-ci

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Build Linux release archives
        run: FLATS_RELEASE_TARGETS="linux/amd64 linux/arm64" scripts/build-release.sh v0.0.0-ci dist
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Build the image for every release platform
        run: docker buildx build --platform linux/amd64,linux/arm64 .
      - name: Build the image for this runner
        run: docker buildx build --load -t flats:ci .
      - name: Bootstrap, deploy, restart and stop a container
        run: |
          tar -xzf dist/flats_linux_amd64.tar.gz -C "$RUNNER_TEMP" flats
          scripts/container-smoke.sh flats:ci v0.0.0-ci "$RUNNER_TEMP/flats"
